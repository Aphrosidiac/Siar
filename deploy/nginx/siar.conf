# Siar — behind Cloudflare (proxied, SSL Full strict with a Cloudflare origin certificate).
#   __DOMAIN__        static marketing site + docs (apps/site/dist → /srv/siar/current/site)
#   app.__DOMAIN__    dashboard (served by the API process from WEB_DIST) + /api for the dashboard
#   api.__DOMAIN__    public REST API
#   media.__DOMAIN__  signed media URLs (/media/…) — networks that pull media fetch from here
upstream siar_api { server 127.0.0.1:3290; keepalive 64; }

# Client address: Cloudflare's CF-Connecting-IP, trusted only from Cloudflare's own ranges
# (/etc/nginx/siar-cloudflare-ips.conf, written by deploy/deploy-shared.sh from cloudflare.com/ips).
# It is included per server block, so it changes nothing for other sites on a shared box. nginx then
# SETS X-Forwarded-For to that one address (never appends a client's own header), and the API trusts
# proxy headers from loopback only (app.ts trustProxy).
# Access log without query strings: OAuth codes, invite and reset tokens travel in them.
log_format siar '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
  listen 80; listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__ app.__DOMAIN__ api.__DOMAIN__ media.__DOMAIN__;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;   # 1.24-compatible form
  server_name www.__DOMAIN__;
  ssl_certificate /etc/ssl/cloudflare/__DOMAIN__.pem; ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
  include /etc/nginx/siar-cloudflare-ips.conf;
  access_log /var/log/nginx/siar.access.log siar;
  return 301 https://__DOMAIN__$request_uri;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;   # 1.24-compatible form
  server_name __DOMAIN__;
  ssl_certificate /etc/ssl/cloudflare/__DOMAIN__.pem; ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
  include /etc/nginx/siar-cloudflare-ips.conf;
  access_log /var/log/nginx/siar.access.log siar;
  root /srv/siar/current/site;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;
  # Fonts also load from emails (Plex in Apple Mail and others), so allow any origin.
  location ^~ /fonts/ { expires 30d; add_header Cache-Control "public, immutable"; add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }
  location ~* \.(css|js|woff2|svg|png|jpg|webp|avif)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/index.html $uri.html =404; }   # not $uri/: that 301s to a trailing slash
  # link-in-bio pages are rendered by the API
  location /b/ { proxy_pass http://siar_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  error_page 404 /404.html;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;   # 1.24-compatible form
  server_name app.__DOMAIN__ api.__DOMAIN__;
  ssl_certificate /etc/ssl/cloudflare/__DOMAIN__.pem; ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
  include /etc/nginx/siar-cloudflare-ips.conf;
  access_log /var/log/nginx/siar.access.log siar;
  client_max_body_size 110M;           # Cloudflare passes 100 MB per request; larger files use /upload/init
  proxy_request_buffering off;
  gzip on; gzip_types application/json text/css application/javascript image/svg+xml text/plain;
  location / {
    proxy_pass http://siar_api;
    proxy_http_version 1.1; proxy_set_header Connection '';
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s; proxy_send_timeout 300s;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;   # 1.24-compatible form
  server_name media.__DOMAIN__;
  ssl_certificate /etc/ssl/cloudflare/__DOMAIN__.pem; ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
  include /etc/nginx/siar-cloudflare-ips.conf;
  access_log /var/log/nginx/siar.access.log siar;
  location /media/ {
    proxy_pass http://siar_api;
    proxy_http_version 1.1; proxy_set_header Connection '';
    proxy_set_header Host $host; proxy_set_header Range $http_range;
    proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off; proxy_read_timeout 600s;
  }
  location / { return 404; }
}
